<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>NEAR MPC Participants</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="site.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--ground);
      color: var(--ink);
      line-height: 1.5;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    .sub { color: var(--ink-soft); margin: 0 0 24px; font-size: 0.9rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .toggle button {
      background: transparent;
      color: var(--ink-soft);
      border: none;
      padding: 8px 16px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .toggle button.active { background: var(--accent); color: var(--on-accent); }
    .rpc-field { display: flex; flex: 1 1 320px; gap: 8px; align-items: center; min-width: 280px; }
    .rpc-field label { color: var(--ink-soft); font-size: 0.85rem; white-space: nowrap; }
    input[type="text"] {
      flex: 1;
      background: var(--ground);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
      font-family: var(--font-data);
    }
    input[type="text"][hidden] { display: none; }
    select {
      background: var(--ground);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .btn {
      background: var(--surface-raised);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent-ink); }
    .quorum { display: flex; align-items: center; gap: 16px; margin: 4px 2px 16px; }
    .quorum[hidden] { display: none; }
    .quorum-value {
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      color: var(--accent-ink);
      font-family: var(--font-data);
    }
    .quorum-label { color: var(--ink-soft); font-size: 0.85rem; }
    .chains { font-size: 0.85rem; color: var(--ink-soft); margin: 0 2px 8px; }
    .chains[hidden] { display: none; }
    .chains-list { color: var(--ink); }
    .status { font-size: 0.85rem; color: var(--ink-soft); margin: 8px 2px 16px; min-height: 1.2em; }
    .status.error { color: var(--danger); }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 0.9rem; vertical-align: top; }
    th { color: var(--ink-soft); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.72rem; }
    tr:last-child td { border-bottom: none; }
    td.account, td.url { font-family: var(--font-data); font-size: 0.82rem; }
    td.url a { color: var(--accent-ink); text-decoration: none; word-break: break-all; }
    td.url a:hover { text-decoration: underline; }
    .empty td { color: var(--ink-soft); text-align: center; padding: 24px; }
    .tee { white-space: nowrap; font-size: 0.8rem; font-weight: 600; }
    .tee.yes { color: var(--accent-ink); }
    .tee.no { color: var(--ink-soft); }
    .tee.unknown { color: var(--ink-soft); }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="Site">
    <a class="site-brand" href="https://nearone.org"><img src="near-one-logo.svg" alt="Near One" width="80" height="28"></a>
    <ul>
      <li><a href="./">Live map <span class="site-tag">mainnet</span></a></li>
      <li><a href="operators.html" aria-current="page">Operators</a></li>
      <li><a href="overview.html">Security</a></li>
    </ul>
    <button id="api-keys" class="button" type="button">API keys</button>
  </nav>
  <div class="wrap">
    <h1>NEAR MPC Operators</h1>
    <p class="sub">Live operator set from the MPC signer contract.</p>

    <div class="controls">
      <div class="toggle" id="networkToggle">
        <button data-network="mainnet" class="active">Mainnet</button>
        <button data-network="testnet">Testnet</button>
      </div>
      <div class="rpc-field">
        <label for="rpcPreset">RPC</label>
        <select id="rpcPreset"></select>
        <input type="text" id="rpcUrl" spellcheck="false" placeholder="https://your-rpc-endpoint" />
      </div>
      <button class="btn" id="refreshBtn">Refresh</button>
    </div>

    <div class="quorum" id="quorum" hidden>
      <span class="quorum-value" id="quorumValue">—</span>
      <span class="quorum-label">operators required to sign<br />(threshold / total)</span>
    </div>

    <div class="chains" id="chains" hidden>
      Supported foreign chain transaction validation: <span class="chains-list" id="chainsList"></span>
    </div>

    <div class="status" id="status"></div>

    <table>
      <thead>
        <tr>
          <th>Operator Name</th>
          <th>Account</th>
          <th>URL</th>
          <th>TEE</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <script type="module">
    import { keyHeaders, onKeysChange } from "./site.js";

    // --- Config -----------------------------------------------------------
    const NETWORKS = {
      mainnet: { contract: "v1.signer" },
      testnet: { contract: "v1.signer-prod.testnet" },
    };

    // Public RPC presets per network (all verified to serve the `state` call).
    // First entry is the default. A "Custom…" option is appended automatically.
    const PRESETS = {
      mainnet: [
        { label: "FastNear (recommended)", url: "https://rpc.mainnet.fastnear.com" },
        { label: "NEAR.org",               url: "https://rpc.mainnet.near.org" },
        { label: "Lava Network",           url: "https://near.lava.build" },
        { label: "dRPC",                   url: "https://near.drpc.org" },
      ],
      testnet: [
        { label: "FastNear (recommended)", url: "https://rpc.testnet.fastnear.com" },
        { label: "NEAR.org",               url: "https://rpc.testnet.near.org" },
        { label: "dRPC",                   url: "https://near-testnet.drpc.org" },
      ],
    };
    const CUSTOM = "__custom__";

    // Account ID -> human-friendly operator name. Best-guesses; edit freely.
    // Covers both mainnet (.near) and testnet (.testnet) accounts.
    const OPERATORS = {
      // mainnet
      "astrostakers-mainnet.near": "Astrostakers",
      "blacksandtech.near": "BlackSand",
      "everstake-mpc-1.near": "Everstake",
      "greenfield-mpc01.near": "Greenfield",
      "hashkeympc.near": "HashKey Cloud",
      "klever-nearmpc-01.near": "Klever",
      "mpc-lgns.near": "Luganodes",
      "mpch-01.near": "MPCH",
      "multichain-mainnet-aurora.near": "Aurora",
      "n1-multichain.near": "Near One",
      "natsai-mpc.near": "Natsai",
      "near-mpc-staking4all-01.near": "Staking4all",
      "nodemonster.near": "Node Monster",
      "stakin-mpc.near": "Stakin",
      "svrn-01.near": "Sovereign",
      "nansen-ai-mpc.near": "Nansen",
      "bitwise-mpc01.near": "Bitwise",
      // testnet
      "astrostakers.testnet": "Astrostakers",
      "aurora-multichain.testnet": "Aurora",
      "bitwise-mpc01.testnet": "Bitwise",
      "bst-near.testnet": "BlackSand",
      "everstake-mpc.testnet": "Everstake",
      "greenfield-keeper.testnet": "Greenfield",
      "hashkeycloud_mpc.testnet": "HashKey Cloud",
      "klever-nearmpc-01.testnet": "Klever",
      "mpc-lgns.testnet": "Luganodes",
      "mpch-01.testnet": "MPCH",
      "n1-multichain.testnet": "Near One",
      "nansen-validator-01.testnet": "Nansen",
      "natsai-mpc.testnet": "Natsai",
      "near-mpc-staking4all-01.testnet": "Staking4all",
      "nodemonster.testnet": "Node Monster",
      "stakin-mpc2.testnet": "Stakin",
      "svrn-01.testnet": "Sovereign",
    };

    // --- State ------------------------------------------------------------
    let currentNetwork = "mainnet";

    const els = {
      toggle: document.getElementById("networkToggle"),
      preset: document.getElementById("rpcPreset"),
      rpc: document.getElementById("rpcUrl"),
      refresh: document.getElementById("refreshBtn"),
      status: document.getElementById("status"),
      quorum: document.getElementById("quorum"),
      quorumValue: document.getElementById("quorumValue"),
      chains: document.getElementById("chains"),
      chainsList: document.getElementById("chainsList"),
      tbody: document.getElementById("tableBody"),
    };

    // Build the preset dropdown for a network and select its default.
    function populatePresets(network) {
      els.preset.replaceChildren();
      for (const p of PRESETS[network]) {
        const opt = document.createElement("option");
        opt.value = p.url;
        opt.textContent = p.label;
        els.preset.appendChild(opt);
      }
      const custom = document.createElement("option");
      custom.value = CUSTOM;
      custom.textContent = "Custom…";
      els.preset.appendChild(custom);
      els.preset.value = PRESETS[network][0].url;
      syncCustomInput();
    }

    // Show the free-entry field only when "Custom…" is selected.
    function syncCustomInput() {
      const isCustom = els.preset.value === CUSTOM;
      els.rpc.hidden = !isCustom;
      if (isCustom) els.rpc.focus();
    }

    // The RPC URL currently in effect.
    function effectiveRpc() {
      return els.preset.value === CUSTOM ? els.rpc.value.trim() : els.preset.value;
    }

    // --- RPC --------------------------------------------------------------
    async function callView(rpcUrl, contract, methodName, args) {
      const body = {
        jsonrpc: "2.0",
        id: "mpc-info",
        method: "query",
        params: {
          request_type: "call_function",
          finality: "final",
          account_id: contract,
          method_name: methodName,
          args_base64: btoa(JSON.stringify(args || {})),
        },
      };
      const resp = await fetch(rpcUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...keyHeaders(rpcUrl) },
        body: JSON.stringify(body),
      });
      if (!resp.ok) throw new Error("HTTP " + resp.status + " " + resp.statusText);
      const json = await resp.json();
      if (json.error) {
        throw new Error(json.error.message || JSON.stringify(json.error));
      }
      const result = json.result;
      if (result && result.error) throw new Error(result.error);
      if (!result || !Array.isArray(result.result)) {
        throw new Error("Unexpected RPC response shape");
      }
      const text = new TextDecoder().decode(new Uint8Array(result.result));
      return JSON.parse(text);
    }

    const fetchState = (rpcUrl, contract) => callView(rpcUrl, contract, "state");

    async function fetchChains(rpcUrl, contract) {
      try {
        const chains = await callView(rpcUrl, contract, "get_available_foreign_chains");
        return Array.isArray(chains) ? chains.map(String) : [];
      } catch (e) {
        return [];
      }
    }

    // A node genuinely runs in a TEE only when its on-chain attestation is a real
    // Intel TDX quote (the `Dstack` variant). Non-TEE nodes submit a `Mock`
    // attestation, which still appears in `get_tee_accounts` — so we must inspect
    // the attestation itself, per TLS key. Returns "Dstack" | "Mock" | "none",
    // or "unknown" if the lookup fails (so we never mislabel a node).
    // Newer contracts wrap it as { attestation: { Dstack | Mock }, accepted_at_seconds }.
    async function fetchTeeStatus(rpcUrl, contract, tlsPublicKey) {
      try {
        const att = await callView(rpcUrl, contract, "get_attestation", {
          tls_public_key: tlsPublicKey,
        });
        if (att == null) return "none";
        const inner = att.attestation && typeof att.attestation === "object" ? att.attestation : att;
        return Object.keys(inner)[0] || "none"; // "Dstack" or "Mock"
      } catch (e) {
        return "unknown";
      }
    }

    // Extract the participant set and signing threshold from the contract state.
    // Returns { threshold, participants } or null if not in the Running state.
    function getParticipants(state) {
      const params = state && state.Running && state.Running.parameters;
      const tuples = params && params.participants && params.participants.participants;
      if (!Array.isArray(tuples)) return null; // not in Running state
      return {
        threshold: typeof params.threshold === "number" ? params.threshold : null,
        participants: tuples.map((t) => ({
          account: t[0],
          url: (t[2] && t[2].url ? String(t[2].url).trim() : ""),
          tls: (t[2] && t[2].tls_public_key) || "",
          name: OPERATORS[t[0]] || t[0],
        })),
      };
    }

    // Path appended to each participant endpoint.
    const LINK_PATH = "/debug/signatures";

    // Normalize a participant URL for linking: force the http scheme and
    // append port 8080 unless a port is already specified explicitly.
    function buildLink(raw) {
      let s = String(raw || "").trim();
      if (!s) return "";
      s = s.replace(/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//, ""); // drop any scheme
      const slash = s.indexOf("/");
      let authority = slash === -1 ? s : s.slice(0, slash); // strip any path
      if (!/:\d+$/.test(authority)) authority += ":8080"; // no explicit port
      return "http://" + authority + LINK_PATH;
    }

    // --- Render -----------------------------------------------------------
    function setStatus(msg, isError) {
      els.status.textContent = msg;
      els.status.classList.toggle("error", !!isError);
    }

    // Prominent "M / N" badge: threshold of total participants.
    function renderQuorum(threshold, total) {
      if (threshold == null) { els.quorum.hidden = true; return; }
      els.quorumValue.textContent = threshold + " / " + total;
      els.quorum.hidden = false;
    }

    function renderChains(chains) {
      els.chains.hidden = !chains.length;
      els.chainsList.textContent = chains.join(", ");
    }

    // Each participant carries a `.tee` status: "Dstack" | "Mock" | "none" | "unknown".
    function renderRows(participants) {
      els.tbody.replaceChildren();
      if (!participants.length) {
        renderMessage("No participants found.");
        return;
      }
      participants
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach((p) => {
          const tr = document.createElement("tr");

          const nameTd = document.createElement("td");
          nameTd.textContent = p.name;

          const accTd = document.createElement("td");
          accTd.className = "account";
          accTd.textContent = p.account;

          const urlTd = document.createElement("td");
          urlTd.className = "url";
          const href = buildLink(p.url);
          if (href) {
            const a = document.createElement("a");
            a.href = href;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.textContent = p.url;
            urlTd.appendChild(a);
          } else {
            urlTd.textContent = "—";
          }

          const teeTd = document.createElement("td");
          if (p.tee === "Dstack") {
            teeTd.className = "tee yes";
            teeTd.textContent = "✓ TDX";
            teeTd.title = "Genuine Intel TDX attestation verified on-chain";
          } else if (p.tee === "Mock") {
            teeTd.className = "tee no";
            teeTd.textContent = "no";
            teeTd.title = "Mock attestation — not running in a TEE";
          } else if (p.tee === "none") {
            teeTd.className = "tee no";
            teeTd.textContent = "no";
            teeTd.title = "No attestation on record";
          } else {
            teeTd.className = "tee unknown";
            teeTd.textContent = "—";
            teeTd.title = "TEE status unavailable";
          }

          tr.append(nameTd, accTd, urlTd, teeTd);
          els.tbody.appendChild(tr);
        });
    }

    function renderMessage(msg) {
      els.tbody.replaceChildren();
      const tr = document.createElement("tr");
      tr.className = "empty";
      const td = document.createElement("td");
      td.colSpan = 4;
      td.textContent = msg;
      tr.appendChild(td);
      els.tbody.appendChild(tr);
    }

    // --- Load -------------------------------------------------------------
    async function load() {
      const net = NETWORKS[currentNetwork];
      const rpcUrl = effectiveRpc();
      if (!rpcUrl) {
        renderMessage("Enter a custom RPC URL.");
        setStatus("No RPC endpoint specified.", true);
        return;
      }
      setStatus("Loading " + net.contract + " from " + rpcUrl + " …", false);
      els.refresh.disabled = true;
      try {
        const [state, chains] = await Promise.all([
          fetchState(rpcUrl, net.contract),
          fetchChains(rpcUrl, net.contract),
        ]);
        renderChains(chains);
        const result = getParticipants(state);
        if (result === null) {
          const variant = state ? Object.keys(state)[0] : "unknown";
          renderQuorum(null);
          renderMessage("Contract is not in Running state (current: " + variant + ").");
          setStatus("Loaded — contract state is \"" + variant + "\".", false);
          return;
        }
        const { threshold, participants } = result;
        const statuses = await Promise.all(
          participants.map((p) => fetchTeeStatus(rpcUrl, net.contract, p.tls))
        );
        participants.forEach((p, i) => { p.tee = statuses[i]; });
        renderQuorum(threshold, participants.length);
        renderRows(participants);
        const inTee = participants.filter((p) => p.tee === "Dstack").length;
        setStatus(
          participants.length + " participants · " + inTee + "/" + participants.length +
          " in TEE · " + net.contract + " · updated " + new Date().toLocaleTimeString(),
          false
        );
      } catch (err) {
        renderQuorum(null);
        renderChains([]);
        renderMessage("Failed to load.");
        setStatus("Error: " + (err && err.message ? err.message : String(err)), true);
      } finally {
        els.refresh.disabled = false;
      }
    }

    function selectNetwork(network) {
      currentNetwork = network;
      for (const btn of els.toggle.querySelectorAll("button")) {
        btn.classList.toggle("active", btn.dataset.network === network);
      }
      populatePresets(network); // reset presets to the network's default
      load();
    }

    // --- Wiring -----------------------------------------------------------
    els.toggle.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-network]");
      if (btn && btn.dataset.network !== currentNetwork) selectNetwork(btn.dataset.network);
    });
    els.preset.addEventListener("change", () => { syncCustomInput(); load(); });
    els.refresh.addEventListener("click", load);
    els.rpc.addEventListener("keydown", (e) => { if (e.key === "Enter") load(); });
    onKeysChange(load);

    // Init
    populatePresets(currentNetwork);
    load();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NEAR MPC Signing Map</title>
  <meta name="description" content="Live map of NEAR Protocol MPC nodes signing chain signatures on v1.signer.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="map/styles.css">
</head>
<body>
  <nav class="site-nav" aria-label="Site">
    <a class="site-brand" href="https://nearone.org"><img src="near-one-logo.svg" alt="Near One" width="80" height="28"></a>
    <ul>
      <li><a href="./" aria-current="page">Live map <span class="site-tag">mainnet</span></a></li>
      <li><a href="operators.html">Operators</a></li>
      <li><a href="overview.html">Security</a></li>
    </ul>
    <button id="api-keys" class="button" type="button">API keys</button>
  </nav>
  <header class="bar">
    <h1>NEAR MPC Signing Map</h1>
    <dl id="stats" class="stats"></dl>
    <ul id="sources" class="sources" aria-label="Data sources"></ul>
  </header>
  <p id="notice" class="notice" role="status" hidden></p>

  <main class="console">
    <section class="panel panel-signatures" aria-labelledby="signatures-title">
      <header class="panel-head">
        <h2 id="signatures-title">Signatures</h2>
      </header>
      <p class="panel-sub">Each request and the node that answered it</p>
      <ol id="signature-log" class="log"></ol>
    </section>

    <section class="stage" aria-label="Network map">
      <div id="map" class="map" role="img" aria-label="World map of MPC nodes with animated signing rounds"></div>
      <ul class="legend">
        <li><span class="swatch swatch-rounds"></span>One color per signature in flight; its row in the list matches</li>
        <li><span class="swatch-node"></span>Ring: node runs in Intel TDX</li>
      </ul>
    </section>

    <section class="panel panel-nodes" aria-labelledby="nodes-title">
      <header class="panel-head">
        <h2 id="nodes-title">Nodes</h2>
      </header>
      <p class="panel-sub">By signatures delivered</p>
      <ul id="roster" class="roster"></ul>
    </section>
  </main>


  <script type="module" src="map/src/main.js"></script>
</body>
</html>
